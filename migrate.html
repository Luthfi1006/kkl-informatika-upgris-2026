<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Migration Tool - KKL Informatika UPGRIS 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 { color: #333; margin-top: 0; }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: bold;
    }
    .status.info { background: #e3f2fd; color: #1565c0; }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
    .status.loading { background: #fff3e0; color: #e65100; }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      font-size: 16px;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .progress {
      background: #f0f0f0;
      border-radius: 4px;
      height: 6px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: #667eea;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    .log {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
      font-family: monospace;
      margin: 10px 0;
    }
    .log-line { margin: 2px 0; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Supabase Migration Tool</h1>
    <p>Migrate data dari JSON ke Supabase database real-time.</p>

    <div id="statusBox" class="status info">
      ⏳ Siap untuk migrate. Klik tombol di bawah.
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button id="btnMigrate" onclick="startMigration()">🚀 Mulai Migrasi Data</button>
    <button id="btnBack" onclick="window.location.href='admin.html'">← Kembali ke Admin Panel</button>

    <div class="log" id="logBox"></div>

    <small style="color: #666;">
      📝 Pastikan sudah setup database schema di Supabase sebelum migrate.
    </small>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const logBox = document.getElementById("logBox");
    const statusBox = document.getElementById("statusBox");
    const progressBar = document.getElementById("progressBar");
    const btnMigrate = document.getElementById("btnMigrate");

    function log(message) {
      const line = document.createElement("div");
      line.className = "log-line";
      line.textContent = message;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(message, type = "info") {
      statusBox.className = `status ${type}`;
      statusBox.textContent = message;
    }

    function setProgress(percent) {
      progressBar.style.width = percent + "%";
    }

    async function startMigration() {
      btnMigrate.disabled = true;
      logBox.innerHTML = "";
      setStatus("⏳ Memulai migrasi...", "loading");

      try {
        // Check Supabase credentials
        if (!window.__SUPABASE_URL__ || !window.__SUPABASE_KEY__) {
          throw new Error("Supabase credentials tidak ditemukan!");
        }

        log("✅ Supabase credentials loaded");
        log("📝 Initializing Supabase client...");

        // Create Supabase client
        const { createClient } = window.supabase;
        const supabase = createClient(window.__SUPABASE_URL__, window.__SUPABASE_KEY__);

        log("✅ Supabase client ready");

        // Load JSON data
        log("📥 Loading data from kkl_data.json...");
        const res = await fetch("./data/kkl_data.json?v=" + Date.now());
        if (!res.ok) throw new Error("Failed to load JSON");
        const jsonData = await res.json();
        log(`✅ JSON loaded (${Object.keys(jsonData).length} sections)`);

        let totalItems = 0;
        let processedItems = 0;

        // Count total items
        if (jsonData.destinations) totalItems += jsonData.destinations.length;
        if (jsonData.profiles) totalItems += jsonData.profiles.length;
        if (jsonData.gallery) totalItems += jsonData.gallery.length;
        if (jsonData.videos) totalItems += jsonData.videos.length;
        if (jsonData.feedback) totalItems += jsonData.feedback.length;

        log(`📊 Total items to migrate: ${totalItems}`);

        // Migrate Destinations
        if (jsonData.destinations && jsonData.destinations.length > 0) {
          log(`\n🗓️ Migrating ${jsonData.destinations.length} destinations...`);
          for (const dest of jsonData.destinations) {
            try {
              await supabase.from("destinations").insert({
                day_no: dest.day_no,
                name: dest.name,
                time: dest.time,
                category: dest.category,
                route: dest.route,
                lat: dest.lat,
                lng: dest.lng,
                description: dest.desc,
                sort_order: dest.id || 0
              });
              processedItems++;
              setProgress((processedItems / totalItems) * 100);
            } catch (err) {
              log(`❌ Error: ${dest.name} - ${err.message}`);
            }
          }
          log(`✅ Destinations done (${processedItems}/${totalItems})`);
        }

        // Migrate Profiles
        if (jsonData.profiles && jsonData.profiles.length > 0) {
          log(`\n👥 Migrating ${jsonData.profiles.length} profiles...`);
          for (const prof of jsonData.profiles) {
            try {
              await supabase.from("profiles").insert({
                name: prof.name,
                role: prof.role,
                bio: prof.bio,
                photo_url: prof.photo,
                sort_order: prof.sort_order || prof.id || 1
              });
              processedItems++;
              setProgress((processedItems / totalItems) * 100);
            } catch (err) {
              log(`❌ Error: ${prof.name} - ${err.message}`);
            }
          }
          log(`✅ Profiles done (${processedItems}/${totalItems})`);
        }

        // Migrate Gallery
        if (jsonData.gallery && jsonData.gallery.length > 0) {
          log(`\n🖼️ Migrating ${jsonData.gallery.length} gallery items...`);
          for (const item of jsonData.gallery) {
            try {
              await supabase.from("gallery").insert({
                title: item.title,
                category: item.category,
                location: item.location,
                image_url: item.image,
                sort_order: item.id || 0
              });
              processedItems++;
              setProgress((processedItems / totalItems) * 100);
            } catch (err) {
              log(`❌ Error: ${item.title} - ${err.message}`);
            }
          }
          log(`✅ Gallery done (${processedItems}/${totalItems})`);
        }

        // Migrate Videos
        if (jsonData.videos && jsonData.videos.length > 0) {
          log(`\n🎬 Migrating ${jsonData.videos.length} videos...`);
          for (const vid of jsonData.videos) {
            try {
              await supabase.from("videos").insert({
                title: vid.title,
                youtube_url: vid.embed_url,
                description: vid.desc,
                sort_order: vid.id || 0
              });
              processedItems++;
              setProgress((processedItems / totalItems) * 100);
            } catch (err) {
              log(`❌ Error: ${vid.title} - ${err.message}`);
            }
          }
          log(`✅ Videos done (${processedItems}/${totalItems})`);
        }

        // Migrate Feedback
        if (jsonData.feedback && jsonData.feedback.length > 0) {
          log(`\n💬 Migrating ${jsonData.feedback.length} feedback items...`);
          for (const fb of jsonData.feedback) {
            try {
              await supabase.from("feedback").insert({
                name: fb.name,
                rating: fb.rating,
                message: fb.message
              });
              processedItems++;
              setProgress((processedItems / totalItems) * 100);
            } catch (err) {
              log(`❌ Error: ${fb.name} - ${err.message}`);
            }
          }
          log(`✅ Feedback done (${processedItems}/${totalItems})`);
        }

        setProgress(100);
        log("\n🎉 Migration completed successfully!");
        setStatus(`✅ Migrasi selesai! ${processedItems} items berhasil di-migrate.`, "success");

      } catch (err) {
        log(`\n❌ Migration failed: ${err.message}`);
        setStatus(`❌ Error: ${err.message}`, "error");
      } finally {
        btnMigrate.disabled = false;
      }
    }
  </script>
</body>
</html>
